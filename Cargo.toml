[package]
name = "xmip-core-transport-named-pipe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-named-pipe"
description = "Named pipe transport: one connection to a named pipe is one Stream — the Windows object under \\\\.\\pipe, a FIFO on Unix. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`), the same on every operating system.
transport = { workspace = true }
# The names what this technology observed of a sender travels under, which
# the identity gates read (`context::property`, ADR-0019 amendment
# 2026-10-06).
context = { workspace = true, optional = true }
# The pipe itself, made, accepted and connected to on each system
# (`net::pipe`), and read to its end under the ceiling (`net::read::to_end`,
# `net::MAX_BODY`).
net = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:context", "dep:net"]
# The declaration alone.
declaration = []

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
